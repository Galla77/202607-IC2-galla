version: '3.8'
services:

  # Servicio del Broker MQTT
  mosquitto:
    image: eclipse-mosquitto:2.0.18 # Versión fijada, prohibido usar latest

    container_name: mqtt_broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

# Servicio de Node-RED
  nodered:

    image: nodered/node-red:5.0.4
    container_name: nodered_container
    ports:
      - "1880:1880"
    volumes:

      - ./node_red:/data          # <-- CAMBIO CLAVE: apunta a tu carpeta local del repo

    environment:
      - TZ=America/Argentina/Buenos_Aires
      - FLOWS=flows.json   
    entrypoint: bash -c "npm install --prefix /data && ./entrypoint.sh"    
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  nodered_data: